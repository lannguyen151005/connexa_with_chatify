# PostgreSQL connection config
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/chatify}

quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=true

# JWT config
smallrye.jwt.sign.key.location=${JWT_SIGN_KEY_LOCATION:jwt/privateKey.pem}
mp.jwt.verify.publickey.location=${JWT_VERIFY_PUBLICKEY_LOCATION:jwt/publicKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:chatify-jwt}

# Cloudinary config
app.cloudinary.url=${CLOUDINARY_URL}

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:*}
quarkus.http.cors.methods=GET, PUT, POST, DELETE, OPTIONS
quarkus.http.cors.headers=Authorization, Content-Type

# Gemini 1.5 flash config (Optional)
#quarkus.langchain4j.ai.gemini.api-key=${GEMINI_API_KEY:}
#quarkus.langchain4j.ai.gemini.model-name=${GEMINI_MODEL_NAME:gemini-1.5-flash}
#quarkus.langchain4j.ai.gemini.log-requests=true
#quarkus.langchain4j.ai.gemini.log-responses=true

# Groq config for testing
quarkus.langchain4j.chat-model.provider=openai
quarkus.langchain4j.openai.api-key=${GROQ_API_KEY}
quarkus.langchain4j.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
quarkus.langchain4j.openai.chat-model.model-name=${GROQ_MODEL_NAME:llama-3.3-70b-versatile}
